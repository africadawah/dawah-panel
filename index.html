<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الباحث الدعوي</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: right-hand rail (nav) + work area; phone → bottom tab bar. Identity: association teal + gold leaf */
:root{
  --bg:#f6f4ee; --surface:#ffffff; --sunk:#eeebe1; --line:#ddd6c2;
  --fg:#1d3335; --muted:#5d6d6e; --brand:#2d4a4c; --brand-fg:#ffffff; --gold:#9c8a4a; --gold-soft:#efe7c9;
  --ok:#1f7a4d; --ok-bg:#e1f3e9; --warn:#a4661a; --warn-bg:#fbefdc; --bad:#b03a3a; --bad-bg:#f8e3e3; --info:#2b5f8a; --info-bg:#e2edf7;
  --f-ui:'Cairo', 'Segoe UI', Tahoma, sans-serif; --f-q:'Amiri', 'Traditional Arabic', serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111a1b; --surface:#182425; --sunk:#0d1516; --line:#2c3b3c;
  --fg:#e7ecea; --muted:#9fb0ae; --brand:#3f6a6c; --brand-fg:#ffffff; --gold:#d2bf7c; --gold-soft:#2c2918;
  --ok:#5fd09a; --ok-bg:#16301f; --warn:#e9b267; --warn-bg:#33270f; --bad:#f08b8b; --bad-bg:#3a1a1a; --info:#86b9e6; --info-bg:#14283a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a1b; --surface:#182425; --sunk:#0d1516; --line:#2c3b3c;
  --fg:#e7ecea; --muted:#9fb0ae; --brand:#3f6a6c; --brand-fg:#ffffff; --gold:#d2bf7c; --gold-soft:#2c2918;
  --ok:#5fd09a; --ok-bg:#16301f; --warn:#e9b267; --warn-bg:#33270f; --bad:#f08b8b; --bad-bg:#3a1a1a; --info:#86b9e6; --info-bg:#14283a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.65;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{background:var(--brand);color:var(--brand-fg);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.logo{background:#fff;border-radius:12px;padding:8px 10px}
.logo img{display:block;width:100%}
.rail h1{font-size:18px;margin:0;font-weight:800;line-height:1.4}
.rail .sub{font-size:12.5px;opacity:.8;margin-top:-12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--brand-fg);text-decoration:none;font-weight:600;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.08);opacity:1}
.nav a[aria-current="page"]{background:rgba(255,255,255,.14);opacity:1;box-shadow:inset -4px 0 0 #d2bf7c}
.nav svg{width:19px;height:19px;flex:none}
.nav .cnt{margin-inline-start:auto;background:#d2bf7c;color:#1d3335;border-radius:20px;font-size:12px;padding:0 8px;font-weight:800}
.rail .foot{margin-top:auto;font-size:12px;opacity:.75;line-height:1.7}
/* main */
main{padding-block:26px 90px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.top h2{margin:0;font-size:27px;font-weight:800;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{color:var(--muted);font-size:13.5px;font-weight:600}
.kpi.alert{border-color:var(--bad);background:var(--bad-bg)} .kpi.alert b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{margin:0 0 10px;font-size:17px;font-weight:800}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar i{display:flex;height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i em{display:block;height:100%;background:var(--gold)}
.bar b{font-variant-numeric:tabular-nums;text-align:left}
/* flow */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin-bottom:22px}
.flow div{flex:1 1 120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.flow div b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.flow div.on{border-color:var(--gold);background:var(--gold-soft)}
/* chips */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.s-new{background:var(--info-bg);color:var(--info)} .s-approved{background:var(--warn-bg);color:var(--warn)}
.s-published{background:var(--ok-bg);color:var(--ok)} .s-rejected{background:var(--bad-bg);color:var(--bad)}
.tag{background:var(--sunk);color:var(--muted)}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.filters input{flex:1 1 200px}
/* item */
.items{display:flex;flex-direction:column;gap:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;border-inline-start:5px solid var(--info)}
.item.st-approved{border-inline-start-color:var(--warn)} .item.st-published{border-inline-start-color:var(--ok)} .item.st-rejected{border-inline-start-color:var(--bad);opacity:.8}
.item.urgent{box-shadow:0 0 0 2px var(--bad)}
.ih{padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;cursor:pointer}
.ih .q{font-weight:800;font-size:17px;direction:ltr;text-align:right;unicode-bidi:plaintext}
.ih .qa{color:var(--muted);font-weight:600}
.ib{border-top:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.ib label{font-size:13px;font-weight:800;color:var(--muted);display:block;margin-bottom:4px}
.ib textarea{width:100%;min-height:210px;resize:vertical;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.7}
.ib textarea.ltr{direction:ltr;text-align:left}
.tr{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:210px;font-size:14.5px}
.tr .qq{font-family:var(--f-q)}
.ia{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:12px}
.checks{display:flex;flex-wrap:wrap;gap:14px}
.checks label{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--fg);margin:0;font-size:14px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--brand)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.pub{display:flex;gap:6px;flex:1 1 280px}
.pub input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;direction:ltr}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:800;background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:plaintext}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:9px 18px;border-radius:12px;font-weight:700;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:7px 11px;text-decoration:none;color:var(--fg);background:var(--surface)}
.lg:hover{border-color:var(--gold)}
.lg span{font-size:12.5px;color:var(--muted)}
.lg.on{background:var(--gold-soft);border-color:var(--gold)}
.phr{display:flex;flex-wrap:wrap;gap:6px}
.phr span{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:13.5px;unicode-bidi:plaintext}
/* phone */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40;gap:0}
  .rail .logo,.rail h1,.rail .sub,.rail .foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;position:relative;text-align:center}
  .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 #d2bf7c}
  .nav .cnt{position:absolute;top:0;left:18%;margin:0;font-size:10px;padding:0 5px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
  .mlogo{display:block!important}
  .ib{grid-template-columns:minmax(0,1fr)}
  .top h2{font-size:23px}
}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.mlogo{display:none;background:#fff;border-radius:10px;padding:6px 10px;margin-bottom:14px;max-width:230px}
.mlogo img{display:block;width:100%}
@media print{
  .rail,.noprint,.toast{display:none!important} .app{display:block} main{padding:0} body{background:#fff;color:#000}
  .panel,.kpi{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo"><img src="logo.png" alt="البيت الأفريقي — HOME AFRICAN"></div>
    <h1>لوحة الباحث الدعوي</h1>
    <div class="sub">أسئلة الناس عن الإسلام ← ردّ من كتب الجمعية</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main>
    <div class="mlogo"><img src="logo.png" alt="البيت الأفريقي"></div>
    <div id="view"><div class="empty">جارٍ تحميل البيانات…</div></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const ICONS={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 queue:'<path d="M4 5h16M4 12h16M4 19h10"/><circle cx="19" cy="19" r="2"/>',
 alerts:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
 report:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 15v-3M12 15V9M15 15v-5"/>',
 library:'<path d="M4 4h5v16H4zM10 4h5v16h-5zM16 5l4 1-3 14-4-1"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'
};
const VIEWS=[["home","الرئيسية"],["queue","الأسئلة والردود"],["alerts","تنبيهات عاجلة"],["report","التقرير الأسبوعي"],["library","المكتبة"],["settings","الإعدادات"]];
const ST={new:"بانتظار المراجعة",approved:"معتمد للنشر",published:"منشور",rejected:"مستبعد"};
const KEY="dawah-panel-v1";
let D=null, S={items:{},reviewer:""}, F={lang:"",platform:"",status:"",week:"",q:""}, open=new Set();

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&v.items)S=v}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
const st=it=>S.items[it.id]||{};
const status=it=>st(it).status||"new";
const reply=it=>st(it).reply??it.reply;
const langName=c=>(D.languages.find(l=>l.code===c)||{}).name||c;
const platName=p=>(D.platforms.find(x=>x.id===p)||{}).name||p;
const book=t=>D.books.find(b=>b.title===t)||{title:t,ar:"",url:"#"};
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}};
function setItem(id,patch){S.items[id]=Object.assign({},S.items[id],patch,{by:S.reviewer||"",at:new Date().toISOString()});save()}
const count=(arr,f)=>arr.reduce((m,x)=>{const k=f(x);m[k]=(m[k]||0)+1;return m},{});
const isUrgent=it=>it.urgent||st(it).urgent;

function nav(cur){
  const urgent=D.items.filter(i=>isUrgent(i)&&status(i)!=="published").length;
  const pending=D.items.filter(i=>status(i)==="new").length;
  document.getElementById("nav").innerHTML=VIEWS.map(([k,t])=>{
    const c=k==="queue"&&pending?`<span class="cnt">${pending}</span>`:k==="alerts"&&urgent?`<span class="cnt">${urgent}</span>`:"";
    return `<a href="#${k}" ${k===cur?'aria-current="page"':""}>${svg(k)}<span>${t}</span>${c}</a>`}).join("");
  document.getElementById("foot").innerHTML=`${esc(D.client)}<br>آخر تحديث للبيانات: ${fmtDate(D.updated)}${S.reviewer?`<br>المراجع: ${esc(S.reviewer)}`:""}`;
}
function head(t,p,actions=""){return `<div class="top"><div><h2>${t}</h2>${p?`<p>${p}</p>`:""}</div><div class="row noprint">${actions}</div></div>`}
function bars(obj,total,nameFn){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);if(!e.length)return `<p style="color:var(--muted)">لا بيانات بعد.</p>`;
  return e.map(([k,v])=>`<div class="bar"><span>${esc(nameFn?nameFn(k):k)}</span><i><em style="width:${Math.round(v/total*100)}%"></em></i><b>${v}</b></div>`).join("")}

/* ---------- views ---------- */
function vHome(){
  const it=D.items, c=count(it,status), urgent=it.filter(isUrgent).length;
  const steps=[["البحث","وُجدت",it.length],["الفرز","مقبولة",it.filter(i=>status(i)!=="rejected").length],["الربط بالكتاب","مربوطة",it.filter(i=>i.book).length],["تجهيز الرد","مسودات",it.length],["المراجعة","معتمدة",(c.approved||0)+(c.published||0)],["النشر","منشورة",c.published||0]];
  return head("الرئيسية",`ملخص عمل المهارة · ${esc(D.weeks.at(-1).label)}`,`<a class="btn pri" href="#queue">راجع الردود (${c.new||0})</a>`)+
  `<div class="kpis">
    <div class="kpi"><b>${it.length}</b><span>أسئلة مناسبة وُجدت</span></div>
    <div class="kpi"><b>${c.new||0}</b><span>بانتظار المراجعة</span></div>
    <div class="kpi"><b>${c.approved||0}</b><span>معتمدة وجاهزة للنشر</span></div>
    <div class="kpi"><b>${c.published||0}</b><span>ردود منشورة</span></div>
    <div class="kpi ${urgent?"alert":""}"><b>${urgent}</b><span>تنبيهات عاجلة</span></div>
  </div>
  <div class="flow">${steps.map((s,i)=>`<div class="${s[2]?"on":""}"><span>${i+1}. ${s[0]}</span><b>${s[2]}</b><span style="color:var(--muted);font-size:12px">${s[1]}</span></div>`).join("")}</div>
  <div class="grid2">
    <div class="panel"><h3>حسب اللغة</h3>${bars(count(it,i=>i.lang),it.length,langName)}</div>
    <div class="panel"><h3>حسب المنصة</h3>${bars(count(it,i=>i.platform),it.length,platName)}</div>
    <div class="panel"><h3>الكتب المستخدمة في الردود</h3>${bars(count(it,i=>i.book),it.length,t=>book(t).ar||t)}</div>
    <div class="panel"><h3>الموضوعات الأكثر سؤالًا</h3>${bars(count(it,i=>i.topic),it.length)}</div>
  </div>`;
}
function itemCard(it){
  const s=st(it), stt=status(it), b=book(it.book), isOpen=open.has(it.id), canApprove=s.sharia&&s.lingua;
  return `<article class="item st-${stt} ${isUrgent(it)?"urgent":""}" data-id="${it.id}">
   <div class="ih" data-act="toggle" role="button" tabindex="0" aria-expanded="${isOpen}">
     <div style="min-width:0;flex:1 1 300px"><div class="q">${esc(it.question)}</div><div class="qa">${esc(it.question_ar)}</div></div>
     <div class="row"><span class="pill s-${stt}">${ST[stt]}</span>${isUrgent(it)?'<span class="pill s-rejected">عاجل</span>':""}<span class="pill tag">${esc(langName(it.lang))}</span><span class="pill tag">${esc(platName(it.platform))}</span></div>
   </div>
   ${isOpen?`<div class="ib">
     <div class="meta"><span>الكتاب: <a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a> (${esc(b.ar)})</span><span>الموضوع: ${esc(it.topic)}</span><span>تاريخ الرصد: ${fmtDate(it.found)}</span><span><a href="${esc(it.url)}" target="_blank" rel="noopener">افتح السؤال ↗</a></span>${s.at?`<span>آخر تعديل: ${esc(s.by||"—")} · ${new Date(s.at).toLocaleString("ar-SA-u-ca-gregory-nu-latn")}</span>`:""}</div>
     <div><label for="r-${it.id}">الرد بلغة السؤال (قابل للتعديل)</label><textarea id="r-${it.id}" class="${it.lang==="am"?"":"ltr"}" data-act="edit" ${stt==="published"?"readonly":""}>${esc(reply(it))}</textarea>
       <div class="row noprint" style="margin-top:6px"><button class="btn sm" data-act="copy">نسخ الرد</button>${s.reply!=null?'<button class="btn sm" data-act="reset">استرجاع نص المهارة</button>':""}${s.reply!=null?'<span class="pill s-approved">معدَّل</span>':""}</div></div>
     <div><label>الترجمة العربية للمراجعة</label><div class="tr">${esc(it.reply_ar).replace(/﴿([^﴾]+)﴾/g,'<span class="qq">﴿$1﴾</span>')}</div>
       ${s.reply!=null?'<p style="font-size:12.5px;color:var(--warn);margin:6px 0 0">عُدّل الرد بعد الترجمة، فقد لا تطابقه الترجمة حرفيًا.</p>':""}</div>
     <div class="ia noprint">
       <div class="checks">
         <label><input type="checkbox" data-act="sharia" ${s.sharia?"checked":""} ${stt==="published"?"disabled":""}> المراجعة الشرعية</label>
         <label><input type="checkbox" data-act="lingua" ${s.lingua?"checked":""} ${stt==="published"?"disabled":""}> المراجعة اللغوية</label>
         <label><input type="checkbox" data-act="urgent" ${isUrgent(it)?"checked":""}> مهتم جادّ (عاجل)</label>
       </div>
       <div class="row">
         ${stt==="new"?`<button class="btn ok" data-act="approve" ${canApprove?"":"disabled title='أكمل المراجعتين أولًا'"}>اعتماد للنشر</button><button class="btn bad" data-act="reject">استبعاد</button>`:""}
         ${stt==="approved"?`<div class="pub"><input type="url" id="p-${it.id}" placeholder="رابط الرد بعد نشره" value="${esc(s.pubUrl||"")}"><button class="btn ok" data-act="publish">تم النشر</button></div><button class="btn sm" data-act="back">إلغاء الاعتماد</button>`:""}
         ${stt==="published"?`<span>نُشر: ${s.pubUrl?`<a class="ltr" href="${esc(s.pubUrl)}" target="_blank" rel="noopener">رابط الرد ↗</a>`:"بدون رابط"}</span><button class="btn sm" data-act="back">إرجاع للمراجعة</button>`:""}
         ${stt==="rejected"?`<span style="color:var(--muted)">السبب: ${esc(s.reason||"—")}</span><button class="btn sm" data-act="back">إرجاع للمراجعة</button>`:""}
       </div>
     </div>
   </div>`:""}
  </article>`;
}
function filtered(){
  return D.items.filter(i=>(!F.lang||i.lang===F.lang)&&(!F.platform||i.platform===F.platform)&&(!F.status||status(i)===F.status)&&(!F.week||i.week===F.week)&&
   (!F.q||(i.question+" "+i.question_ar+" "+i.topic+" "+i.book).toLowerCase().includes(F.q.toLowerCase())))
}
function vQueue(){
  const opt=(arr,v)=>arr.map(([k,t])=>`<option value="${esc(k)}" ${F[v]===k?"selected":""}>${esc(t)}</option>`).join("");
  const list=filtered();
  return head("الأسئلة والردود","كل سؤال مع رابطه والكتاب المربوط والرد المقترح وترجمته. لا يُعتمد رد قبل المراجعتين الشرعية واللغوية.")+
  `<div class="filters noprint">
    <input type="search" id="fq" placeholder="ابحث في الأسئلة والكتب…" value="${esc(F.q)}" aria-label="بحث">
    <select id="fstatus" aria-label="الحالة"><option value="">كل الحالات</option>${opt(Object.entries(ST),"status")}</select>
    <select id="flang" aria-label="اللغة"><option value="">كل اللغات</option>${opt(D.languages.map(l=>[l.code,l.name]),"lang")}</select>
    <select id="fplatform" aria-label="المنصة"><option value="">كل المنصات</option>${opt(D.platforms.map(p=>[p.id,p.name]),"platform")}</select>
    <select id="fweek" aria-label="الأسبوع"><option value="">كل الأسابيع</option>${opt(D.weeks.map(w=>[w.id,w.label]),"week")}</select>
  </div>
  <div class="items">${list.length?list.map(itemCard).join(""):'<div class="empty">لا توجد أسئلة بهذه التصفية.</div>'}</div>`;
}
function vAlerts(){
  const list=D.items.filter(isUrgent);
  return head("تنبيهات عاجلة","أشخاص كتبوا علنًا أنهم يريدون الإسلام أو يحتاجون من يرشدهم. يُرد عليهم علنًا بدعوتهم للتواصل مع الجمعية خلال 24 ساعة.")+
  `<div class="note">لا نجمع بيانات أحد ولا نرسل رسائل خاصة غير مطلوبة: الرد علني في مكان السؤال، والتواصل يبقى بمبادرة الشخص نفسه.</div>`+
  (list.length?`<div class="items">${list.map(itemCard).join("")}</div>`:`<div class="empty">لا تنبيهات عاجلة هذا الأسبوع.<br>لتحويل سؤال إلى تنبيه، افتحه في «الأسئلة والردود» وفعّل «مهتم جادّ».</div>`);
}
function vReport(){
  const wk=F.week||D.weeks.at(-1).id, w=D.weeks.find(x=>x.id===wk)||D.weeks.at(-1), it=D.items.filter(i=>i.week===w.id), c=count(it,status);
  const pub=it.filter(i=>status(i)==="published"), urgent=it.filter(isUrgent), bk=count(it,i=>i.book), topBook=Object.entries(bk).sort((a,b)=>b[1]-a[1])[0];
  const langs=[...new Set(it.map(i=>langName(i.lang)))].join("، "), plats=[...new Set(it.map(i=>platName(i.platform)))].join("، ");
  const rows=[["الفترة",w.label],["اللغات والمنصات",`${langs||"—"} · ${plats||"—"}`],["أسئلة مناسبة وُجدت",it.length],["أسئلة استُبعدت",w.excluded||"—"],
   ["بانتظار المراجعة",c.new||0],["معتمدة للنشر",c.approved||0],["ردود منشورة",c.published||0],["مستبعدة عند المراجعة",c.rejected||0],
   ["تنبيهات عاجلة",urgent.length||"لا شيء هذا الأسبوع"],["الموضوعات الأكثر طلبًا",(w.topics||[]).join("، ")||"—"],["الكتاب الأكثر استخدامًا",topBook?`${book(topBook[0]).ar} · عدد الردود: ${topBook[1]}`:"—"]];
  return head("التقرير الأسبوعي",`${esc(D.client)}`,`<select id="fweek2" class="btn" aria-label="الأسبوع">${D.weeks.map(x=>`<option value="${x.id}" ${x.id===w.id?"selected":""}>${esc(x.label)}</option>`).join("")}</select><button class="btn pri" data-act="print">طباعة / PDF</button>`)+
  `<div class="panel" style="margin-bottom:16px"><h3>الملخص</h3><div class="tw"><table><tbody>${rows.map(r=>`<tr><th style="width:35%">${r[0]}</th><td class="num">${esc(r[1])}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel" style="margin-bottom:16px"><h3>الأسئلة والردود</h3><div class="tw"><table><thead><tr><th>السؤال</th><th>المعنى</th><th>الكتاب</th><th>الحالة</th></tr></thead><tbody>
   ${it.map(i=>`<tr><td class="ltr"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.question)}</a></td><td>${esc(i.question_ar)}</td><td>${esc(book(i.book).ar)}</td><td><span class="pill s-${status(i)}">${ST[status(i)]}</span></td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel"><h3>الردود المنشورة</h3>${pub.length?`<div class="tw"><table><thead><tr><th>السؤال</th><th>رابط الرد</th><th>المراجع</th></tr></thead><tbody>${pub.map(i=>`<tr><td class="ltr">${esc(i.question)}</td><td>${st(i).pubUrl?`<a class="ltr" href="${esc(st(i).pubUrl)}" target="_blank" rel="noopener">فتح ↗</a>`:"—"}</td><td>${esc(st(i).by||"—")}</td></tr>`).join("")}</tbody></table></div>`:`<p style="color:var(--muted);margin:0">لا ردود منشورة بعد في هذا الأسبوع.</p>`}</div>`;
}
function vLibrary(){
  const S2=D.site, ours=new Set(D.languages.map(l=>l.code));
  return head("المكتبة","مصدران تربط بهما المهارة الأسئلة: مكتبة البيت الأفريقي بأكثر من 35 لغة، والملخصات البرتغالية. المهارة تبحث في المكتبة بلغة السؤال وتختار المادة المناسبة، دون تنزيل الكتب.",`<a class="btn pri" href="${esc(S2.url)}" target="_blank" rel="noopener">افتح مكتبة البيت الأفريقي ↗</a>`)+
  `<div class="panel" style="margin-bottom:16px"><h3>${esc(S2.name)} · ${S2.languages.length} لغة</h3>
   <p style="margin:0 0 10px;color:var(--muted);font-size:14px">اللغات المميّزة هي لغات الخدمة. اضغط أي لغة لفتح موادها.</p>
   <div class="langs">${S2.languages.map(l=>`<a class="lg ${ours.has(l.code)?"on":""}" href="${esc(S2.contents.replace("{code}",l.code))}" target="_blank" rel="noopener"><b>${esc(l.name)}</b><span class="ltr">${esc(l.native)}</span></a>`).join("")}</div></div>
  <div class="panel"><h3>الكتب المربوطة بالردود</h3><div class="tw"><table><thead><tr><th>الكتاب</th><th>العنوان العربي</th><th>اللغة</th><th>المصدر</th><th>يُستخدم لأسئلة</th><th>ردود</th></tr></thead><tbody>
  ${D.books.map(b=>`<tr><td class="ltr"><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a></td><td>${esc(b.ar)}</td><td>${esc(langName(b.lang))}</td><td class="ltr">${esc(b.source||"")}</td><td>${esc(b.topic)}</td><td class="num">${D.items.filter(i=>i.book===b.title).length}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function vSettings(){
  return head("الإعدادات","اللغات والمنصات وعبارات البحث التي تعمل بها المهارة، وأدوات حفظ قرارات المراجعة.")+
  `<div class="grid2">
   <div class="panel"><h3>المراجع</h3><label for="rev" style="font-weight:700;font-size:13.5px">اسمك (يظهر بجانب كل اعتماد أو نشر)</label>
     <div class="row" style="margin-top:6px"><input id="rev" value="${esc(S.reviewer)}" style="flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px"><button class="btn pri" data-act="saverev">حفظ</button></div></div>
   <div class="panel"><h3>قرارات المراجعة</h3><p style="margin:0 0 10px;color:var(--muted);font-size:14px">تُحفظ القرارات في هذا المتصفح. صدّرها وأرسلها لنا لنضمّها إلى التقرير، أو استورد ملف قرارات من جهاز آخر.</p>
     <div class="row"><button class="btn pri" data-act="export">تصدير القرارات</button><label class="btn" for="imp">استيراد قرارات</label><input type="file" id="imp" accept="application/json" hidden><button class="btn bad" data-act="clear">مسح القرارات</button></div>
     <div id="clearbox" hidden style="margin-top:10px" class="note">سيُمسح كل اعتماد وتعديل ونشر محفوظ في هذا المتصفح. <button class="btn bad sm" data-act="clearyes">نعم، امسح</button> <button class="btn sm" data-act="clearno">تراجع</button></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>اللغات وعبارات البحث</h3><div class="tw"><table><thead><tr><th>اللغة</th><th>الحالة</th><th>أمثلة عبارات البحث</th></tr></thead><tbody>
  ${D.languages.map(l=>`<tr><td><b>${esc(l.name)}</b><br><span class="ltr" style="color:var(--muted)">${esc(l.native)}</span></td><td><span class="pill ${l.active?"s-published":"tag"}">${l.active?"مفعّلة":"حسب الباقة"}</span><br><a style="font-size:12.5px" href="${esc(D.site.contents.replace("{code}",l.code))}" target="_blank" rel="noopener">موادها في المكتبة ↗</a></td><td><div class="phr">${(D.phrases[l.code]||[]).map(p=>`<span>${esc(p)}</span>`).join("")}</div></td></tr>`).join("")}</tbody></table></div>
  <p style="font-size:13px;color:var(--muted);margin:8px 0 0">عبارات اللغات الأفريقية يراجعها متحدث أصلي قبل تفعيل اللغة.</p></div>
  <div class="panel" style="margin-top:16px"><h3>المنصات</h3><div class="tw"><table><thead><tr><th>المنصة</th><th>طريقة الوصول</th><th>الحالة</th></tr></thead><tbody>
  ${D.platforms.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.access)}</td><td><span class="pill ${p.active?"s-published":"tag"}">${p.active?"مفعّلة":"غير مفعّلة"}</span></td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel" style="margin-top:16px"><h3>الضوابط</h3><ul style="margin:0;padding-inline-start:20px">
   <li>نبحث عن أسئلة منشورة علنًا، ولا نبني قوائم بأسماء أشخاص أو بيانات تواصلهم.</li>
   <li>الرد علني داخل النقاش نفسه، ولا رسائل خاصة غير مطلوبة.</li>
   <li>لا يُنشر رد قبل المراجعة الشرعية واللغوية، ولا ردود على الأسئلة العدائية أو الفتاوى دون مختص.</li>
   <li>يوزَّع النشر على أيام مختلفة حتى لا تُعدّ الردود المتشابهة رسائل مكررة.</li></ul></div>`;
}

/* ---------- render & events ---------- */
function render(){
  let v=(location.hash||"#home").slice(1); if(!VIEWS.some(x=>x[0]===v)) v="home";
  nav(v);
  const fn={home:vHome,queue:vQueue,alerts:vAlerts,report:vReport,library:vLibrary,settings:vSettings}[v];
  document.getElementById("view").innerHTML=fn();
  document.title=VIEWS.find(x=>x[0]===v)[1]+" · لوحة الباحث الدعوي";
}
function rerenderKeepFocus(){const a=document.activeElement, id=a&&a.id, pos=a&&a.selectionStart;render();if(id){const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const card=t.closest(".item"), id=card&&card.dataset.id, it=id&&D.items.find(i=>i.id===id), act=t.dataset.act;
  if(act==="toggle"){open.has(id)?open.delete(id):open.add(id);render();return}
  if(act==="copy"){const txt=document.getElementById("r-"+id).value;try{await navigator.clipboard.writeText(txt);toast("نُسخ الرد")}catch(err){const ta=document.getElementById("r-"+id);ta.select();toast("حدّد النص وانسخه يدويًا")}return}
  if(act==="reset"){const s=S.items[id];delete s.reply;save();render();toast("استُرجع نص المهارة");return}
  if(act==="approve"){setItem(id,{status:"approved"});render();toast("اعتُمد الرد للنشر");return}
  if(act==="reject"){setItem(id,{status:"rejected",reason:"استُبعد عند المراجعة"});render();toast("استُبعد السؤال");return}
  if(act==="publish"){const u=document.getElementById("p-"+id).value.trim();setItem(id,{status:"published",pubUrl:u});render();toast("سُجّل الرد منشورًا");return}
  if(act==="back"){setItem(id,{status:"new"});render();toast("أُعيد للمراجعة");return}
  if(act==="print"){window.print();return}
  if(act==="saverev"){S.reviewer=document.getElementById("rev").value.trim();save();render();toast("حُفظ الاسم");return}
  if(act==="export"){const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),reviewer:S.reviewer,items:S.items},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`قرارات-المراجعة-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();toast("صُدّرت القرارات");return}
  if(act==="clear"){document.getElementById("clearbox").hidden=false;return}
  if(act==="clearno"){document.getElementById("clearbox").hidden=true;return}
  if(act==="clearyes"){S.items={};save();render();toast("مُسحت القرارات");return}
});
document.addEventListener("keydown",e=>{const t=e.target.closest('[data-act="toggle"]');if(t&&(e.key==="Enter"||e.key===" ")&&e.target===t){e.preventDefault();t.click()}});
document.addEventListener("change",e=>{
  const t=e.target, card=t.closest(".item"), id=card&&card.dataset.id;
  if(t.dataset.act==="sharia"||t.dataset.act==="lingua"||t.dataset.act==="urgent"){setItem(id,{[t.dataset.act]:t.checked});render();return}
  if(t.id==="fstatus"){F.status=t.value;render()} else if(t.id==="flang"){F.lang=t.value;render()} else if(t.id==="fplatform"){F.platform=t.value;render()}
  else if(t.id==="fweek"||t.id==="fweek2"){F.week=t.value;render()}
  else if(t.id==="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);Object.assign(S.items,v.items||{});save();render();toast("استوردت القرارات")}catch(err){toast("الملف ليس ملف قرارات صالحًا")}};r.readAsText(t.files[0])}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fq"){F.q=t.value;rerenderKeepFocus();return}
  if(t.dataset.act==="edit"){const id=t.closest(".item").dataset.id, it=D.items.find(i=>i.id===id);
    S.items[id]=Object.assign({},S.items[id],{reply:t.value===it.reply?undefined:t.value});if(S.items[id].reply===undefined)delete S.items[id].reply;save()}
});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

(async()=>{
  load();
  try{const r=await fetch("data.json?v="+Date.now());D=await r.json()}
  catch(e){document.getElementById("view").innerHTML='<div class="empty">تعذّر تحميل ملف البيانات data.json. افتح اللوحة من رابطها على GitHub Pages.</div>';return}
  render();
})();
</script>
</body>
</html>
